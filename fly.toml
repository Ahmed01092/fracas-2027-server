app = "fracas-2027-online"
primary_region = "fra"

[build]
  dockerfile = "deploy/Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8128"

[http_service]
  internal_port = 8128
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "5s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "3s"
